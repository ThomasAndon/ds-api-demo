<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型配置后台</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main><section id="login" class="card"><h1>配置后台</h1><p>使用提示词编辑页的保存密码登录。</p><form id="login-form"><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="login-error" class="error"></p></form></section>
<section id="config" class="card hidden"><header><div><h1>LLM 凭据</h1><p>保存多套模型服务配置，点击一次即可切换。</p></div><button id="logout" class="secondary">退出</button></header>
<div class="toolbar"><button id="add-profile" type="button">新增凭据</button><span id="list-status"></span></div><div id="profiles" class="profiles"></div>
<form id="profile-form" class="editor hidden"><input id="profile_id" type="hidden"><div class="editor-title"><h2 id="editor-heading">新增凭据</h2><button id="cancel-edit" type="button" class="secondary">取消</button></div>
<label>名称<input id="name" required maxlength="100" placeholder="例如：DeepSeek 官方 / GPT 中转"></label>
<label>OpenAI 兼容 URL<input id="base_url" type="url" required value="https://la-api.vxvxvx.top/v1"><small>DeepSeek 官方请填写 api.deepseek.com，系统会自动启用原生思考与搜索协议。</small></label>
<label>API Key<input id="api_key" type="password" autocomplete="new-password" placeholder="编辑时留空表示不修改"><small id="key-status"></small></label>
<label>模型<div class="model-row"><select id="model" required><option value="gpt-5.3-codex">gpt-5.3-codex</option></select><button id="load-models" type="button" class="secondary">获取模型列表</button></div><small id="model-status">填写 URL 和 API Key 后可获取模型。</small></label>
<label>温度<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" required></label>
<button id="save-profile">保存凭据</button><p id="profile-status"></p></form>
<form id="access-form" class="access"><h2>前台密码</h2><label>新的前台密码<input id="access_password" type="password" autocomplete="new-password" placeholder="留空不会修改"></label><button>更新前台密码</button><p id="access-status"></p></form>
</section></main><script src="/admin/admin.js"></script></body></html>
