<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型配置后台</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main><section id="login" class="card"><h1>配置后台</h1><p>使用提示词编辑页的保存密码登录。</p><form id="login-form"><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="login-error" class="error"></p></form></section>
<section id="config" class="card hidden"><header><div><h1>LLM 配置</h1><p>配置只保存在服务器端，不会下发 API Key。</p></div><button id="logout" class="secondary">退出</button></header><form id="config-form">
<label>OpenAI 兼容 URL<input id="base_url" type="url" required placeholder="https://api.example.com/v1"><small>可填写 API 根地址或完整的 /chat/completions 地址。</small></label>
<label>API Key<input id="api_key" type="password" autocomplete="new-password" placeholder="留空表示不修改"><small id="key-status"></small></label>
<label>模型<div class="model-row"><select id="model" required><option value="gpt-5.3-codex">gpt-5.3-codex</option></select><button id="load-models" type="button" class="secondary">获取模型列表</button></div><small id="model-status">可先填写 URL 和 API Key，再获取模型列表。</small></label>
<label>温度<input id="temperature" type="number" min="0" max="2" step="0.1" required></label>
<label>前台访问密码<input id="access_password" type="password" autocomplete="new-password" placeholder="留空表示不修改"><small id="access-status"></small></label>
<button id="save">保存配置</button><p id="status"></p></form></section></main><script src="/admin/admin.js"></script></body></html>
